name: student-planner
services:
  backend:
    build: .
    environment:
      DATABASE_PATH: /data/database.db
      TZ: Asia/Qyzylorda
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - planner_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
      TZ: Asia/Qyzylorda
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  planner_data:
